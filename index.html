<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clinical Trial Finder</title>
    <style>
        body {
            margin: 0;
            background: #f1f5f9;
            color: #172b3a;
            font: 1rem/1.6 system-ui, sans-serif;
        }

        main {
            max-width: 48rem;
            margin: clamp(1rem, 6vw, 4rem) auto;
            padding: clamp(1rem, 5vw, 3rem);
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 6vw, 3rem);
            line-height: 1.15;
        }
    </style>
</head>
<body>
    <main>
        <h1>Clinical Trial Finder</h1>
        <p>Explore public study records from ClinicalTrials.gov.</p>
        <form method="get">
            <label for="condition">Condition</label>
            <input id="condition" name="condition" value="{{ condition }}" required>
            <button type="submit">Search trials</button>
        </form>
        {% if error %}
        <p role="alert">{{ error }}</p>
        {% endif %}
        {% if trials %}
        <section aria-labelledby="results-title">
            <h2 id="results-title">Trial results</h2>
            <ul>
                {% for trial in trials %}
                <li>
                    <a href="{{ trial.url }}">{{ trial.title }}</a>
                    <span>{{ trial.id }} · {{ trial.status }}</span>
                </li>
                {% endfor %}
            </ul>
        </section>
        {% endif %}
    </main>
</body>
</html>
